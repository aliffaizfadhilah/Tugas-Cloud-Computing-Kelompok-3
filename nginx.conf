upstream api {
  server api1:3000 max_fails=2 fail_timeout=5s;
  server api2:3000 max_fails=2 fail_timeout=5s;
}
server {
  listen 80;
  location / {
    proxy_pass http://api;
    proxy_connect_timeout 1s;
    proxy_read_timeout 15s;
    # retry hanya untuk instance yang mati. Sengaja TANPA http_503:
    # kalau DB mati, kedua API membalas 503 dan itu harus sampai ke klien, bukan membuat nginx menandai semua upstream mati.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
