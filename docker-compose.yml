name: konser        # nama project tetap, jadi volume bernama konser_pgdata, konser_redisdata

services:
  api1:
    build: .
    ports: ["3001:3000"]          # sementara, nanti lewat nginx
    environment:
      DATABASE_URL: postgres://ticket:ticketpw@postgres:5432/ticketing
      REDIS_URL: redis://redis:6379
      HOLD_SECONDS: 300
      ADMIT_PER_TICK: ${ADMIT_PER_TICK:-5}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticketpw
      POSTGRES_DB: ticketing
    command: postgres -c wal_level=replica -c max_wal_senders=5 -c hot_standby=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketing"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
